name: Build Liquid Volume APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'
      - name: Check Maven repository connectivity
        shell: bash
        run: |
          for url in \
            'https://repo.maven.apache.org/maven2/org/jetbrains/kotlin/kotlin-stdlib/2.0.21/kotlin-stdlib-2.0.21.pom' \
            'https://dl.google.com/dl/android/maven2/com/android/tools/build/gradle/8.13.2/gradle-8.13.2.pom'; do
            echo "Checking $url"
            curl --location --head --max-time 20 --silent --show-error --output /dev/null --write-out 'HTTP %{http_code}\n' "$url" || true
          done
      - name: Build debug APK
        run: gradle --no-daemon --refresh-dependencies :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: LiquidVolume-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
